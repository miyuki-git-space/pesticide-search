<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="種子リスト">
<meta name="theme-color" content="#4a7c3a">
<title>種子リスト</title>
<style>
  :root{
    --bg:#f5f3ec; --card:#ffffff; --ink:#2f3a2c; --sub:#6b7a63;
    --line:#e2ddce; --accent:#4a7c3a; --accent-d:#3a6330;
    --warn:#c0492f; --warnbg:#fbeae6; --ok:#4a7c3a; --okbg:#eaf3e4;
    --chip:#eef0e6; --chipact:#4a7c3a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    line-height:1.6;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:10;background:var(--accent);color:#fff;
    padding:14px 16px 12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  @media (max-width:600px){ header{position:static} }
  .switchbar{max-width:1100px;margin:0 auto 8px;display:flex;gap:8px}
  .switchbar a{flex:1;text-align:center;text-decoration:none;font-size:14px;font-weight:700;
    padding:9px 10px;border-radius:8px}
  .switchbar a.cur{background:#fff;color:var(--accent-d)}
  .switchbar a.alt{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5)}
  header h1{margin:0;font-size:20px;display:flex;align-items:center;gap:8px}
  header .count{font-size:13px;opacity:.9;margin-top:2px}
  .controls{max-width:1100px;margin:0 auto}
  .searchwrap{margin:10px auto 0;max-width:1100px}
  #search{width:100%;padding:11px 14px;font-size:16px;border:none;border-radius:8px;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
  .filters{max-width:1100px;margin:10px auto 0;display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--chip);color:var(--ink);border:1px solid var(--line);
    padding:5px 11px;border-radius:16px;font-size:13px;cursor:pointer;user-select:none}
  .chip.active{background:#fff;color:var(--accent-d);border-color:#fff;font-weight:700}
  .toolbar{max-width:1100px;margin:10px auto 0;display:flex;gap:10px;align-items:center;
    flex-wrap:wrap;font-size:13px;color:#eef0e6}
  .toolbar label{display:flex;align-items:center;gap:5px;cursor:pointer}
  main{max-width:1100px;margin:0 auto;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .card.used{opacity:.55}
  .imgbox{position:relative;background:#ddd;aspect-ratio:3/4;overflow:hidden;cursor:pointer}
  .imgbox img{width:100%;height:100%;object-fit:cover;display:block}
  .imgbox .side{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;
    font-size:11px;padding:2px 8px;border-radius:12px}
  .imgbox .flip{position:absolute;bottom:8px;right:8px;background:rgba(255,255,255,.92);
    color:var(--ink);font-size:11px;padding:3px 9px;border-radius:12px;border:none;cursor:pointer}
  .imgbox .flip.disabled{opacity:.4;cursor:default}
  .body{padding:12px 13px;flex:1;display:flex;flex-direction:column;gap:7px}
  .titlerow{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
  .name{font-weight:700;font-size:16px;line-height:1.35}
  .yomi{font-size:11px;color:var(--sub)}
  .tag{display:inline-block;background:var(--accent);color:#fff;font-size:11px;
    padding:2px 9px;border-radius:12px;white-space:nowrap;flex-shrink:0}
  .maker{font-size:12px;color:var(--sub)}
  .badge{font-size:11px;padding:2px 8px;border-radius:10px;display:inline-block}
  .badge.warn{background:var(--warnbg);color:var(--warn)}
  .badge.ok{background:var(--okbg);color:var(--ok)}
  .badge.sow{background:#e6f0d6;color:#3a6330;border:1px solid #b9d49a;font-weight:700}
  table.spec{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:2px}
  table.spec th{text-align:left;color:var(--sub);font-weight:500;white-space:nowrap;
    vertical-align:top;padding:2px 8px 2px 0;width:5.2em}
  table.spec td{vertical-align:top;padding:2px 0}
  .feat{font-size:12.5px;color:#3d4a38;background:#f7f8f2;border-radius:8px;padding:8px 10px;margin-top:2px}
  .cardfoot{border-top:1px solid var(--line);padding:9px 13px;display:flex;
    flex-direction:column;gap:7px;background:#fafbf6}
  .usedrow{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;user-select:none}
  .memo{width:100%;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);
    border-radius:6px;resize:vertical;font-family:inherit;min-height:32px}
  .empty{text-align:center;color:var(--sub);padding:40px 0}
  footer{max-width:1100px;margin:0 auto;padding:8px 16px 30px;color:var(--sub);font-size:11px}
  /* lightbox */
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:50;
    align-items:center;justify-content:center;flex-direction:column;padding:16px}
  #lb.open{display:flex}
  #lb img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:6px}
  #lb .lbcap{color:#fff;margin-top:10px;font-size:14px;text-align:center}
  #lb .lbclose{position:absolute;top:14px;right:18px;color:#fff;font-size:30px;
    background:none;border:none;cursor:pointer;line-height:1}
  #lb .lbnav{color:#fff;background:rgba(255,255,255,.15);border:none;font-size:14px;
    padding:8px 16px;border-radius:8px;margin-top:12px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="controls">
    <div class="switchbar">
      <a class="alt" href="../">🧪 農薬検索</a>
      <a class="cur" href="./">🌱 種子リスト</a>
    </div>
    <h1>🌱 種子リスト <span class="count" id="count"></span></h1>
    <div class="searchwrap">
      <input id="search" type="search" placeholder="品種名・メーカー・特性・よみで検索…" autocomplete="off">
    </div>
    <div class="filters" id="filters"></div>
    <div class="toolbar">
      <label><input type="checkbox" id="hideUsed"> 使い切ったものを隠す</label>
      <label>まき時期(暖地):
        <select id="sowMonth" style="font-size:13px;padding:2px 4px;border-radius:5px;border:none">
          <option value="">指定なし</option>
          <option value="now">今まけるもの</option>
          <option value="1">1月にまける</option>
          <option value="2">2月にまける</option>
          <option value="3">3月にまける</option>
          <option value="4">4月にまける</option>
          <option value="5">5月にまける</option>
          <option value="6">6月にまける</option>
          <option value="7">7月にまける</option>
          <option value="8">8月にまける</option>
          <option value="9">9月にまける</option>
          <option value="10">10月にまける</option>
          <option value="11">11月にまける</option>
          <option value="12">12月にまける</option>
        </select>
      </label>
      <label>並び順:
        <select id="sort" style="font-size:13px;padding:2px 4px;border-radius:5px;border:none">
          <option value="cat">種類順</option>
          <option value="name">品種名順</option>
          <option value="expiry">有効期限が近い順</option>
        </select>
      </label>
    </div>
    <div style="max-width:1100px;margin:6px auto 0;font-size:11px;color:#dbe6d2">
      ※「まき時期」は裏面を撮影した品種のみ・暖地(福岡)基準のおおよその目安です。
    </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>該当する種子がありません。</div>
</main>
<footer id="foot"></footer>

<div id="lb" role="dialog" aria-modal="true">
  <button class="lbclose" id="lbclose" aria-label="閉じる">×</button>
  <img id="lbimg" alt="">
  <div class="lbcap" id="lbcap"></div>
  <button class="lbnav" id="lbflip">表 ⇔ 裏を切り替え</button>
</div>

const LS_KEY = "seedListState_v1";
let state = {};
try{ state = JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ state={}; }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function keyOf(s){ return s.表 || s.品種名; }
function st(s){ return state[keyOf(s)] || (state[keyOf(s)]={used:false,memo:""}); }

// 有効期限を数値(年*12+月)に変換して期限判定
function parseExpiry(str){
  if(!str) return null;
  let m = str.match(/(20\d{2})\s*年\s*(\d{1,2})?/);      // 2025年10月
  if(!m) { let mm = str.match(/'?(\d{2})\s*年\s*(\d{1,2})?/); // '25年3月
    if(mm){ let y=2000+parseInt(mm[1],10); let mo=mm[2]?parseInt(mm[2],10):12; return y*12+mo; } return null; }
  let y=parseInt(m[1],10); let mo=m[2]?parseInt(m[2],10):12;
  return y*12+mo;
}
const NOW = new Date();
const NOWV = NOW.getFullYear()*12 + (NOW.getMonth()+1);
const CURMONTH = NOW.getMonth()+1;
function sowLabel(s){ const a=(s.まき月||[]).slice().sort((x,y)=>x-y); return a.length? a.map(m=>m+"月").join("・") : ""; }
function sowNowBadge(s){ return (s.まき月&&s.まき月.includes(CURMONTH))? '<span class="badge sow">🌱今がまきどき</span>' : ""; }
function expiryBadge(s){
  const v = parseExpiry(s.有効期限);
  if(v===null) return "";
  if(v < NOWV) return '<span class="badge warn">期限切れの可能性</span>';
  if(v - NOWV <= 6) return '<span class="badge warn">まもなく期限</span>';
  return '<span class="badge ok">期限内</span>';
}

const grid=document.getElementById('grid');
const search=document.getElementById('search');
const filtersEl=document.getElementById('filters');
const countEl=document.getElementById('count');
const emptyEl=document.getElementById('empty');
const hideUsed=document.getElementById('hideUsed');
const sortSel=document.getElementById('sort');
const sowSel=document.getElementById('sowMonth');

// 種類フィルタ生成
const cats = [...new Set(DATA.map(d=>d.種類).filter(Boolean))].sort();
let activeCat="すべて";
function buildFilters(){
  filtersEl.innerHTML="";
  ["すべて",...cats].forEach(c=>{
    const b=document.createElement('span');
    b.className="chip"+(c===activeCat?" active":"");
    b.textContent=c;
    b.onclick=()=>{activeCat=c;buildFilters();render();};
    filtersEl.appendChild(b);
  });
}

function matches(s,q){
  if(!q) return true;
  const hay=[s.品種名,s.よみ,s.メーカー,s.種類,s.特性,s.播種時期].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(t=>hay.includes(t));
}

function esc(t){return (t==null?"":String(t)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function specRow(label,val){ return val? `<tr><th>${label}</th><td>${esc(val)}</td></tr>`:""; }

let lbList=[], lbIdx=0, lbFront=true;
function openLB(s){
  lbList=[s]; lbIdx=0; lbFront=true; showLB();
  document.getElementById('lb').classList.add('open');
}
function showLB(){
  const s=lbList[lbIdx];
  const img=(lbFront? s.表 : (s.裏||s.表));
  document.getElementById('lbimg').src=IMGBASE+img;
  document.getElementById('lbcap').textContent=s.品種名+"　("+(lbFront?"表":"裏")+")";
  document.getElementById('lbflip').style.display = s.裏? "block":"none";
}
document.getElementById('lbclose').onclick=()=>document.getElementById('lb').classList.remove('open');
document.getElementById('lb').onclick=(e)=>{ if(e.target.id==='lb') e.currentTarget.classList.remove('open'); };
document.getElementById('lbflip').onclick=()=>{ lbFront=!lbFront; showLB(); };

function render(){
  const q=search.value.trim();
  const sowVal=sowSel.value;
  let list=DATA.filter(s=>s.種類===activeCat||activeCat==="すべて")
               .filter(s=>matches(s,q))
               .filter(s=>!(hideUsed.checked && st(s).used))
               .filter(s=>{
                 if(!sowVal) return true;
                 const arr=s.まき月||[];
                 if(!arr.length) return false;
                 const m = sowVal==="now"? CURMONTH : parseInt(sowVal,10);
                 return arr.includes(m);
               });
  const sv=sortSel.value;
  list.sort((a,b)=>{
    if(sv==="name") return (a.よみ||a.品種名).localeCompare(b.よみ||b.品種名,'ja');
    if(sv==="expiry"){ const av=parseExpiry(a.有効期限)??999999, bv=parseExpiry(b.有効期限)??999999; return av-bv; }
    return (a.種類||"").localeCompare(b.種類||"",'ja') || (a.品種名).localeCompare(b.品種名,'ja');
  });
  grid.innerHTML="";
  list.forEach(s=>{
    const state1=st(s);
    const card=document.createElement('div');
    card.className="card"+(state1.used?" used":"");
    const hasBack=!!s.裏;
    card.innerHTML=`
      <div class="imgbox" data-front="1">
        <img src="${IMGBASE}${esc(s.表)}" loading="lazy" alt="${esc(s.品種名)}">
        <span class="side">表</span>
        <button class="flip ${hasBack?'':'disabled'}">${hasBack?'裏を見る':'裏なし'}</button>
      </div>
      <div class="body">
        <div class="titlerow">
          <div>
            <div class="name">${esc(s.品種名)}</div>
            ${s.よみ?`<div class="yomi">${esc(s.よみ)}</div>`:""}
          </div>
          <span class="tag">${esc(s.種類||"—")}</span>
        </div>
        ${s.メーカー?`<div class="maker">🏢 ${esc(s.メーカー)}</div>`:""}
        <div>${sowNowBadge(s)} ${expiryBadge(s)}</div>
        <table class="spec">
          ${specRow("まき時期",sowLabel(s))}
          ${specRow("価格",s.価格)}
          ${specRow("数量",s.数量)}
          ${specRow("発芽率",s.発芽率)}
          ${specRow("有効期限",s.有効期限)}
          ${specRow("播種メモ",s.播種時期)}
        </table>
        ${s.特性?`<div class="feat">${esc(s.特性)}</div>`:""}
      </div>
      <div class="cardfoot">
        <label class="usedrow"><input type="checkbox" class="usedchk" ${state1.used?"checked":""}> 使い切った</label>
        <textarea class="memo" placeholder="メモ（まいた日・場所など）">${esc(state1.memo)}</textarea>
      </div>`;
    // image flip + lightbox
    const imgbox=card.querySelector('.imgbox');
    const imgEl=imgbox.querySelector('img');
    const sideEl=imgbox.querySelector('.side');
    const flipBtn=imgbox.querySelector('.flip');
    let front=true;
    function setSide(f){ front=f; imgEl.src=IMGBASE+(f? s.表 : s.裏); sideEl.textContent=f?"表":"裏"; flipBtn.textContent=f?"裏を見る":"表を見る"; }
    if(hasBack){ flipBtn.onclick=(e)=>{e.stopPropagation();setSide(!front);}; }
    imgEl.onclick=()=>{ openLB(s); };
    // used
    card.querySelector('.usedchk').onchange=(e)=>{ state1.used=e.target.checked; save(); render(); };
    // memo
    const ta=card.querySelector('.memo');
    ta.onchange=()=>{ state1.memo=ta.value; save(); };
    grid.appendChild(card);
  });
  countEl.textContent="全"+DATA.length+"品種中 "+list.length+"件";
  emptyEl.hidden=list.length>0;
  document.getElementById('foot').textContent=
    "種子写真フォルダ内の写真から作成。使い切った状態とメモはこのブラウザに保存されます（写真を再読込しても消えません）。";
}
buildFilters();
search.oninput=render;
hideUsed.onchange=render;
sortSel.onchange=render;
sowSel.onchange=render;
render();
</script>
