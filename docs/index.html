<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="農薬検索">
  <title>農薬適用作物検索</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background: #f0f4f0;
      color: #1a1a1a;
    }

    header {
      background: #2d6a4f;
      color: white;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    header p {
      font-size: 0.75rem;
      opacity: 0.8;
      margin-top: 2px;
    }

    .search-bar {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .search-bar input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      outline: none;
    }

    .search-bar button {
      padding: 10px 18px;
      background: #52b788;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .search-bar button:active {
      background: #40916c;
    }

    main {
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    .summary {
      background: #d8f3dc;
      border-left: 4px solid #52b788;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: #1b4332;
    }

    .no-result {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #664d03;
    }

    .hint {
      color: #555;
      font-size: 0.9rem;
      margin-top: 20px;
      text-align: center;
      line-height: 1.7;
    }

    /* タブ */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tab-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 2px solid #52b788;
      background: white;
      color: #2d6a4f;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: #2d6a4f;
      color: white;
    }

    /* カード */
    .card {
      background: white;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .card-header {
      background: #2d6a4f;
      color: white;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    th {
      background: #f1f8f4;
      color: #2d6a4f;
      padding: 7px 10px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
    }

    td {
      padding: 7px 10px;
      border-top: 1px solid #e8f0ea;
      vertical-align: top;
    }

    tr:nth-child(even) td {
      background: #fafcfa;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
      font-size: 0.9rem;
    }

    .data-info {
      font-size: 0.72rem;
      color: #888;
      text-align: right;
      margin-top: 20px;
    }

    .parent-section {
      margin-top: 20px;
      border-top: 2px dashed #b7e4c7;
      padding-top: 14px;
    }

    .parent-section-title {
      font-size: 0.82rem;
      color: #40916c;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      background: #d8f3dc;
      color: #1b4332;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 6px;
      font-weight: normal;
    }

    /* スクロール可能なテーブルラッパー */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body>

<header>
  <h1>🌱 農薬適用作物検索</h1>
  <p>手持ち農薬から使える農薬を検索</p>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="作物名を入力（例: トマト）"
           inputmode="search" autocomplete="off">
    <button onclick="doSearch()">検索</button>
  </div>
</header>

<main>
  <div id="result">
    <p class="hint">作物名を入力して検索してください<br>（例: トマト、きゅうり、なす、いちご）</p>
  </div>
  <p class="data-info" id="dataInfo"></p>
</main>

<script>
  let cache = {};
  let dataDate = "";

  // データ読み込み
  fetch("pesticide_cache.json?v=" + Date.now())
    .then(r => r.json())
    .then(data => {
      cache = data;
      const count = Object.keys(cache).length;
      document.getElementById("dataInfo").textContent =
        `データ: ${count} 品目取得済み`;
    })
    .catch(() => {
      document.getElementById("dataInfo").textContent = "⚠️ データ読み込みエラー";
    });

  // Enterキーで検索
  document.getElementById("searchInput").addEventListener("keydown", e => {
    if (e.key === "Enter") doSearch();
  });

  // 半角・全角カタカナ → ひらがな変換
  function toHiragana(str) {
    // 半角カタカナ（濁点・半濁点の組み合わせを先に処理）
    const dakuten = {
      'ｶﾞ':'ガ','ｷﾞ':'ギ','ｸﾞ':'グ','ｹﾞ':'ゲ','ｺﾞ':'ゴ',
      'ｻﾞ':'ザ','ｼﾞ':'ジ','ｽﾞ':'ズ','ｾﾞ':'ゼ','ｿﾞ':'ゾ',
      'ﾀﾞ':'ダ','ﾁﾞ':'ヂ','ﾂﾞ':'ヅ','ﾃﾞ':'デ','ﾄﾞ':'ド',
      'ﾊﾞ':'バ','ﾋﾞ':'ビ','ﾌﾞ':'ブ','ﾍﾞ':'ベ','ﾎﾞ':'ボ',
      'ﾊﾟ':'パ','ﾋﾟ':'ピ','ﾌﾟ':'プ','ﾍﾟ':'ペ','ﾎﾟ':'ポ',
      'ｳﾞ':'ヴ',
    };
    str = str.replace(/[ｦ-ﾟ]{2}/g, m => dakuten[m] || m);
    // 残りの単体半角カタカナ → 全角カタカナ
    const hw = {'ｦ':'ヲ','ｧ':'ァ','ｨ':'ィ','ｩ':'ゥ','ｪ':'ェ','ｫ':'ォ','ｬ':'ャ','ｭ':'ュ',
      'ｮ':'ョ','ｯ':'ッ','ｰ':'ー','ｱ':'ア','ｲ':'イ','ｳ':'ウ','ｴ':'エ','ｵ':'オ','ｶ':'カ',
      'ｷ':'キ','ｸ':'ク','ｹ':'ケ','ｺ':'コ','ｻ':'サ','ｼ':'シ','ｽ':'ス','ｾ':'セ','ｿ':'ソ',
      'ﾀ':'タ','ﾁ':'チ','ﾂ':'ツ','ﾃ':'テ','ﾄ':'ト','ﾅ':'ナ','ﾆ':'ニ','ﾇ':'ヌ','ﾈ':'ネ',
      'ﾉ':'ノ','ﾊ':'ハ','ﾋ':'ヒ','ﾌ':'フ','ﾍ':'ヘ','ﾎ':'ホ','ﾏ':'マ','ﾐ':'ミ','ﾑ':'ム',
      'ﾒ':'メ','ﾓ':'モ','ﾔ':'ヤ','ﾕ':'ユ','ﾖ':'ヨ','ﾗ':'ラ','ﾘ':'リ','ﾙ':'ル','ﾚ':'レ',
      'ﾛ':'ロ','ﾜ':'ワ','ﾝ':'ン'};
    str = str.replace(/[ｦ-ﾝ]/g, ch => hw[ch] || ch);
    // 全角カタカナ → ひらがな
    str = str.replace(/[ァ-ヶ]/g, ch =>
      String.fromCharCode(ch.charCodeAt(0) - 0x60)
    );
    return str;
  }

  // ─── 上位分類マッピング ───
  // キー: ユーザーが入力する作物名（ひらがな or 漢字混じり）
  // 値: その作物が属する上位分類名（農薬データの表記に合わせる）
  const CROP_PARENTS = {
    // ─ なばな類 → 非結球あぶらな科葉菜類 → 野菜類 ─
    'つぼみ菜':    ['なばな類', '非結球あぶらな科葉菜類', '野菜類'],
    'つぼみな':    ['なばな類', '非結球あぶらな科葉菜類', '野菜類'],
    // ─ 非結球あぶらな科葉菜類 → 野菜類 ─
    'かつおな':    ['非結球あぶらな科葉菜類', '野菜類'],
    'こまつな':    ['非結球あぶらな科葉菜類', '野菜類'],
    'みずな':      ['非結球あぶらな科葉菜類', '野菜類'],
    'ちんげんさい':['非結球あぶらな科葉菜類', '野菜類'],
    'のざわな':    ['非結球あぶらな科葉菜類', '野菜類'],
    'けーる':      ['非結球あぶらな科葉菜類', '野菜類'],
    // ─ 結球あぶらな科葉菜類 → 野菜類 ─
    'きゃべつ':    ['結球あぶらな科葉菜類', '野菜類'],
    'はくさい':    ['結球あぶらな科葉菜類', '野菜類'],
    '白菜':        ['結球あぶらな科葉菜類', '野菜類'],
    // ─ はなやさい類 → 野菜類 ─
    'ぶろっこりー':['はなやさい類', '野菜類'],
    'かりふらわー':['はなやさい類', '野菜類'],
    // ─ うり類 ─
    'かぼちゃ':    ['うり類(成熟)', '野菜類'],
    'すいか':      ['うり類(成熟)', '野菜類'],
    'めろん':      ['うり類(成熟)', '野菜類'],
    'うり':        ['うり類(成熟)', 'うり類(漬物用)', '野菜類'],
    'しろうり':    ['うり類(漬物用)', '野菜類'],
    'きゅうり':    ['うり類(未成熟)', '野菜類'],
    'ずっきーに':  ['うり類(未成熟)', '野菜類'],
    'にがうり':    ['うり類(未成熟)', '野菜類'],
    // ─ ピーマン及びとうがらし類（野菜類からは除外されているため含めない）─
    'ぴーまん':    ['ぴーまん及びとうがらし類'],
    'とうがらし':  ['ぴーまん及びとうがらし類'],
    // ─ 豆類(未成熟) → 野菜類 ─
    'すなっぷえんどう': ['豆類(未成熟)', '野菜類'],
    'ぐりーんぴーす':   ['豆類(未成熟)', '野菜類'],
    'えだまめ':    ['豆類(未成熟)', '野菜類'],
    'さやいんげん':['豆類(未成熟)', '野菜類'],
    'さやえんどう':['豆類(未成熟)', '野菜類'],
    // ─ 鱗茎類（野菜類からは除外されているため鱗茎類のみ）─
    'たまねぎ':    ['鱗茎類'],
    'ねぎ':        ['鱗茎類'],
    // ─ 野菜類のみ（サブカテゴリ無し）─
    'おくら':      ['野菜類'],
    'らっかせい':  ['野菜類'],
    '落花生':      ['野菜類'],
    // ─ 根菜類 → 野菜類（だいこんは野菜類から除外されているが根菜類には含まれる）─
    'だいこん':    ['根菜類', '野菜類'],
    '大根':        ['根菜類', '野菜類'],
    // ─ いも類（さつまいも＝かんしょ。いも類(かんしょを除く)からは除外される）─
    'さつまいも':  ['いも類', '野菜類'],
    'かんしょ':    ['いも類', '野菜類'],
    // 注: なす・すいとう は野菜類から除外または対象外のため省略
  };

  // 農薬登録での別名マッピング（除外リストの表記が異なる場合の対応）
  const CROP_ALIASES = {
    'さつまいも': ['かんしょ'],
    'かんしょ':   ['さつまいも'],
  };

  // カテゴリ名を「ベース名」と「除外リスト」に分解
  function parseCategoryName(cropName) {
    const lastExclude = cropName.lastIndexOf('を除く');
    if (lastExclude === -1) return { base: cropName.trim(), exclusions: [] };

    // 対応する開き括弧を探す
    let parenStart = -1, depth = 0;
    for (let i = lastExclude; i >= 0; i--) {
      const ch = cropName[i];
      if (ch === ')' || ch === '）') depth++;
      else if (ch === '(' || ch === '（') {
        if (depth === 0) { parenStart = i; break; }
        depth--;
      }
    }
    if (parenStart === -1) return { base: cropName.trim(), exclusions: [] };

    const base = cropName.substring(0, parenStart).trim();
    const inner = cropName.substring(parenStart + 1, lastExclude).trim();

    if (inner.includes('ただし')) {
      const tadashiIdx = inner.indexOf('ただし');
      const descriptor = inner.substring(0, tadashiIdx).replace(/[、,，､]$/, '').trim();
      const rest = inner.substring(tadashiIdx + 3).replace(/^[、,，､]/, '').trim();
      const actualBase = descriptor ? `${base}(${descriptor})` : base;
      return { base: actualBase, exclusions: splitTopLevel(rest) };
    }
    return { base, exclusions: splitTopLevel(inner) };
  }

  // 括弧の深さ0のみで文字列を分割
  function splitTopLevel(str) {
    const items = [];
    let depth = 0, current = '';
    for (const ch of str) {
      if (ch === '(' || ch === '（') { depth++; current += ch; }
      else if (ch === ')' || ch === '）') { depth--; current += ch; }
      else if (depth === 0 && (ch === '、' || ch === ',' || ch === '，' || ch === '､')) {
        if (current.trim()) items.push(current.trim());
        current = '';
      } else { current += ch; }
    }
    if (current.trim()) items.push(current.trim());
    return items;
  }

  // 検索した作物がこのカテゴリから除外されているか判定
  function isCropExcluded(normQuery, exclusions, cropParents) {
    const normParents = (cropParents || []).map(p => toHiragana(p.toLowerCase()));
    // 別名も含めて判定（例: さつまいも → かんしょ）
    const aliases = (CROP_ALIASES[normQuery] || []).map(a => toHiragana(a.toLowerCase()));
    for (const ex of exclusions) {
      const normEx = toHiragana(ex.trim().toLowerCase());
      if (!normEx) continue;
      // 直接一致
      if (normEx === normQuery || normEx.includes(normQuery) || normQuery.includes(normEx)) return true;
      // 別名で一致
      if (aliases.some(a => a === normEx || a.includes(normEx) || normEx.includes(a))) return true;
      // 上位分類として一致（例: 除外が「なばな類」で検索作物がなばな類に属する場合）
      if (normParents.some(p => p === normEx || p.startsWith(normEx) || normEx.startsWith(p))) return true;
    }
    return false;
  }

  // 上位分類として適用される農薬を検索
  function findParentMatches(query, directGrouped) {
    const normQuery = toHiragana(query.toLowerCase());

    // 上位分類を取得（完全一致優先、部分一致はスコアで選別）
    let cropParents = [];
    let bestScore = -1;
    for (const [crop, parents] of Object.entries(CROP_PARENTS)) {
      const normCrop = toHiragana(crop.toLowerCase());
      let score = -1;
      if (normCrop === normQuery) {
        score = 1000; // 完全一致
      } else if (normQuery.includes(normCrop) && normCrop.length >= 2) {
        score = normCrop.length; // クエリがキーを含む（長い方優先）
      } else if (normCrop.includes(normQuery) && normQuery.length >= 2) {
        score = normQuery.length - 100; // キーがクエリを含む（低優先）
      }
      if (score > bestScore) {
        bestScore = score;
        cropParents = parents;
      }
    }
    if (cropParents.length === 0) return {};

    const parentGrouped = {};
    for (const [reg, entry] of Object.entries(cache)) {
      const name = entry["農薬名"] || "";
      // すでに直接検索でヒットしている農薬は除外
      if (directGrouped[name]) continue;

      const matchingRows = [];
      for (const r of (entry["適用表"] || [])) {
        const cropName = r["適用作物名"] || "";
        const { base, exclusions } = parseCategoryName(cropName);
        const normBase = toHiragana(base.toLowerCase());

        for (const parentCat of cropParents) {
          const normParent = toHiragana(parentCat.toLowerCase());
          if (normBase === normParent) {
            if (!isCropExcluded(normQuery, exclusions, cropParents)) {
              matchingRows.push({ ...r, _parentCategory: parentCat });
            }
            break;
          }
        }
      }
      if (matchingRows.length > 0) {
        parentGrouped[name] = { rows: matchingRows, reg };
      }
    }
    return parentGrouped;
  }

  function doSearch() {
    const query = document.getElementById("searchInput").value.trim();
    const resultDiv = document.getElementById("result");

    if (!query) {
      resultDiv.innerHTML = '<p class="hint">作物名を入力して検索してください</p>';
      return;
    }

    if (Object.keys(cache).length === 0) {
      resultDiv.innerHTML = '<div class="no-result">データを読み込み中です。しばらく待ってから再度お試しください。</div>';
      return;
    }

    const q = toHiragana(query.toLowerCase());
    const grouped = {};

    for (const [reg, entry] of Object.entries(cache)) {
      const name = entry["農薬名"] || "";
      const rows = (entry["適用表"] || []).filter(r =>
        toHiragana((r["適用作物名"] || "").toLowerCase()).includes(q)
      );
      if (rows.length > 0) {
        grouped[name] = { rows, reg };
      }
    }

    // 上位分類での検索
    const parentGrouped = findParentMatches(query, grouped);

    const pesticides = Object.keys(grouped);
    const parentPesticides = Object.keys(parentGrouped);

    if (pesticides.length === 0 && parentPesticides.length === 0) {
      resultDiv.innerHTML = `<div class="no-result">「${query}」に使える農薬は手持ちの中にありませんでした。</div>`;
      return;
    }

    const totalRows = pesticides.reduce((s, n) => s + grouped[n].rows.length, 0);
    const totalParentRows = parentPesticides.reduce((s, n) => s + parentGrouped[n].rows.length, 0);

    let html = `<div class="summary">「${query}」に使える農薬: <strong>${pesticides.length} 品目 / ${totalRows} 件</strong>`;
    if (parentPesticides.length > 0) {
      html += `<br><span style="font-size:0.82rem;color:#40916c">上位分類でも ${parentPesticides.length} 品目 / ${totalParentRows} 件あり（下に表示）</span>`;
    }
    html += `</div>`;

    // タブ（直接一致分）
    if (pesticides.length > 0) {
      html += '<div class="tabs">';
      html += `<button class="tab-btn active" onclick="showTab('__all__', this)">すべて</button>`;
      for (const name of pesticides) {
        const safe = name.replace(/'/g, "\\'");
        html += `<button class="tab-btn" onclick="showTab('${safe}', this)">${name}</button>`;
      }
      html += '</div>';

      html += '<div id="allCards">';
      for (const name of pesticides) {
        html += buildCard(name, grouped[name].rows);
      }
      html += '</div>';

      for (const name of pesticides) {
        const id = "card_" + name.replace(/\s/g, "_");
        html += `<div id="${id}" style="display:none">`;
        html += buildCard(name, grouped[name].rows);
        html += '</div>';
      }
    } else {
      html += '<div id="allCards"></div>';
    }

    // 上位分類セクション
    if (parentPesticides.length > 0) {
      const normQ = toHiragana(query.toLowerCase());
      let parentCatNames = [];
      for (const [crop, parents] of Object.entries(CROP_PARENTS)) {
        if (toHiragana(crop.toLowerCase()).includes(normQ) || normQ.includes(toHiragana(crop.toLowerCase()))) {
          parentCatNames = parents;
          break;
        }
      }
      const catLabel = parentCatNames.slice(0, 2).join('・') || '上位分類';

      html += `<div class="parent-section">`;
      html += `<div class="parent-section-title">「${catLabel}」に登録された農薬 （${parentPesticides.length} 品目 / ${totalParentRows} 件）</div>`;
      for (const name of parentPesticides) {
        const catInfo = parentGrouped[name].rows[0]?._parentCategory || '';
        html += buildCard(name, parentGrouped[name].rows, catInfo);
      }
      html += `</div>`;
    }

    resultDiv.innerHTML = html;
  }

  function buildCard(name, rows, badge) {
    const COLS = [
      ["適用作物名",       "作物名"],
      ["対象病害虫・雑草名","対象病害虫・雑草"],
      ["希釈倍数",         "希釈倍数"],
      ["使用液量",         "使用液量"],
      ["使用時期",         "使用時期"],
      ["本剤の使用回数",   "使用回数"],
      ["使用方法",         "使用方法"],
    ];

    // 空列を除外
    const activeCols = COLS.filter(([key]) =>
      rows.some(r => r[key] && r[key].trim() !== "")
    );

    let html = `<div class="card">`;
    const badgeHtml = badge ? `<span class="badge">${badge}として適用</span>` : '';
    html += `<div class="card-header">🌿 ${name}${badgeHtml}</div>`;
    html += `<div class="table-wrap"><table>`;
    html += "<thead><tr>" + activeCols.map(([,label]) => `<th>${label}</th>`).join("") + "</tr></thead>";
    html += "<tbody>";
    for (const row of rows) {
      html += "<tr>" + activeCols.map(([key]) => `<td>${row[key] || ""}</td>`).join("") + "</tr>";
    }
    html += "</tbody></table></div></div>";
    return html;
  }

  function showTab(name, btn) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    document.getElementById("allCards").style.display = name === "__all__" ? "" : "none";

    document.querySelectorAll('[id^="card_"]').forEach(el => {
      el.style.display = "none";
    });

    if (name !== "__all__") {
      const id = "card_" + name.replace(/\s/g, "_");
      const el = document.getElementById(id);
      if (el) el.style.display = "";
    }
  }
</script>

<!-- Service Worker 登録 -->
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
